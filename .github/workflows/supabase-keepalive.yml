# Supabase free projects pause after ~7 days without activity, which takes the whole
# backend (sign-in, credits, generation) offline. A tiny read every 3 days keeps it awake.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the public REST API
        run: |
          URL=$(grep -o 'SUPABASE_URL: "[^"]*"' <(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/docs/config.js) | cut -d'"' -f2)
          KEY=$(grep -o 'SUPABASE_ANON_KEY: "[^"]*"' <(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/docs/config.js) | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/profiles?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "status $code"
          test "$code" = 200
